[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
arc-core = { path = "crates/arc-core" }
arc-objects = { path = "crates/arc-objects" }
arc-refs = { path = "crates/arc-refs" }
arc-ops = { path = "crates/arc-ops" }
arc-workspace = { path = "crates/arc-workspace" }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
