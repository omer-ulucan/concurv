[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
concurv-core = { path = "crates/concurv-core" }
concurv-objects = { path = "crates/concurv-objects" }
concurv-refs = { path = "crates/concurv-refs" }
concurv-ops = { path = "crates/concurv-ops" }
concurv-workspace = { path = "crates/concurv-workspace" }
concurv-git = { path = "crates/concurv-git" }
concurv-bench = { path = "crates/concurv-bench" }
concurv-sync = { path = "crates/concurv-sync" }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
getrandom = "0.4"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
