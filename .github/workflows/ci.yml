name: ci

# Manual only: GitHub Actions is not used for now. The same gate runs
# locally with scripts/ci-local.sh (Linux/WSL, macOS, Git Bash on Windows)
# and scripts/ci-all.sh (Windows + WSL at once). Restore the `push` and
# `pull_request` triggers when hosted CI is available again.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: R1 gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain and platform
        shell: bash
        run: rustc --version && cargo --version && uname -a
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      - name: cargo build --release
        run: cargo build --release --locked

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
