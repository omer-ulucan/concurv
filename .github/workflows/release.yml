name: release

# Builds release binaries for a `v*` tag after the full gate passes on
# every platform, then publishes a GitHub release with checksums. Tags
# containing `-` (e.g. v0.1.0-alpha.1) are marked as pre-releases.
# Manual only while GitHub Actions is not used: run it on a tag ref
# ("Use workflow from: <tag>"). Releases are otherwise built locally.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Gate (native target only)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked --no-fail-fast
      - name: Build
        run: cargo build --release --locked -p concurv-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="concurv-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in concurv concurvd; do
            bin=target/${{ matrix.target }}/release/$b
            [ -f "$bin.exe" ] && bin="$bin.exe"
            cp "$bin" "dist/$name/"
          done
          cp README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a -bd "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "concurv ${GITHUB_REF_NAME}" \
            --notes-file "$notes" "${pre[@]}" --verify-tag
